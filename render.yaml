services:
  - type: web
    name: omnigamedev-ai-backend
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: omnigamedev-ai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: OMNIGAMEDEV_PROJECTS_ROOT
        value: /data/projects
      - key: OMNIGAMEDEV_MEMORY_ROOT
        value: /data/memory
      - key: OMNIGAMEDEV_MEMORY_BACKEND
        value: local
      - key: OMNIGAMEDEV_API_TOKEN
        sync: false
