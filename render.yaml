services:
  - type: web
    name: omnigamedev-ai-backend
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: OMNIGAMEDEV_PROJECTS_ROOT
        value: /tmp/omnigamedev-projects
      - key: OMNIGAMEDEV_MEMORY_ROOT
        value: /tmp/omnigamedev-memory
      - key: OMNIGAMEDEV_MEMORY_BACKEND
        value: mongo
      - key: OMNIGAMEDEV_API_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: omnigamedev
